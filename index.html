<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1033">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="스택 타워 - 야식 편 🍗"><meta property="og:description" content="탭해서 쌓아! 친구보다 높이 쌓을 수 있을까?">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🍗%3C/text%3E%3C/svg%3E">
<title>스택 타워 - 야식 편</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1033;color:#fff;touch-action:none;overscroll-behavior:none;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
canvas{display:block;width:100%;height:100%}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;touch-action:pan-y;text-align:center;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));background:rgba(14,7,32,.95)}
.ov::before,.ov::after{content:"";flex:1 0 0}
#over{background:rgba(14,7,32,.84)}
#pz{background:rgba(14,7,32,.92)}
button:focus-visible{outline:3px solid #fff}
#pb{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;width:44px;height:44px;padding:0;margin:0;border-radius:50%;font-size:18px;background:rgba(255,255,255,.2);box-shadow:none;z-index:5}
#sa{position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top)}
.hide{display:none!important}
h1{font-size:34px;line-height:1.2;margin:0 0 8px;font-weight:900}
.sub{margin:0 0 16px;font-size:15px;line-height:1.5;opacity:.85}
.ttl{font-size:22px;font-weight:800;color:#ffd84d}
.big{font-size:68px;font-weight:900;line-height:1.1;margin:4px 0}
.q{margin:0 0 6px;font-size:15px;opacity:.9}
.st{margin:0 0 18px;font-size:13px;opacity:.7}
.nb{background:#ff3d6e;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:800;margin-bottom:4px}
button{border:0;border-radius:16px;padding:14px 24px;margin:5px;font-size:17px;font-weight:800;color:#fff;font-family:inherit;background:linear-gradient(135deg,#ff5e8a,#ff9a4d);box-shadow:0 6px 18px rgba(0,0,0,.35)}
button:active{transform:scale(.96)}
button.s{background:rgba(255,255,255,.18);box-shadow:none}
#sk{display:flex;gap:8px;margin-bottom:14px}
#sk button{width:68px;padding:8px 0;font-size:26px;line-height:1.1;background:rgba(255,255,255,.12);box-shadow:none;margin:0}
#sk button small{display:block;font-size:11px;font-weight:700}
#sk button.on{outline:3px solid #ffd84d;background:rgba(255,216,77,.2)}
#sk button.lk{opacity:.45}
#al{text-align:left;width:100%;max-width:320px;margin-bottom:14px}
#al div{padding:8px 12px;margin:4px 0;border-radius:10px;background:rgba(255,255,255,.1);font-size:15px}
#al div.ok{background:rgba(255,216,77,.25);font-weight:700}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#ffd84d;color:#2a1a4d;font-weight:800;padding:9px 18px;border-radius:99px;font-size:15px;z-index:9;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="toast" class="hide"></div>
<div id="sa"></div>
<button id="pb" class="hide" aria-label="일시정지">⏸</button>
<div class="ov hide" id="pz">
  <h1>⏸ 일시정지</h1>
  <div><button id="rs">▶ 계속하기</button></div>
  <div><button id="rt" class="s">🔄 처음부터</button></div>
  <div><button id="qm" class="s">🏠 메뉴로</button></div>
  <p class="st">메뉴로 나가거나 처음부터 하면 이번 판은 기록되지 않아요</p>
</div>

<div class="ov" id="menu">
  <h1>스택 타워<br>야식 편 🍗</h1>
  <p class="sub">탭해서 쌓아! 삐끗하면 깎여요 😇<br>PERFECT 3연속이면 폭이 회복돼요</p>
  <div id="sk"></div>
  <div><button id="go">시작하기</button></div>
  <div><button id="dl">📅 오늘의 챌린지</button></div>
  <div><button id="am" class="s">🏅 업적</button><button id="rk" class="s">🏆 랭킹</button><button id="mu" class="s">🔊</button></div>
  <p class="st" id="ms"></p>
</div>

<div class="ov hide" id="ach">
  <h1 id="ah">🏅 업적</h1>
  <div id="al"></div>
  <button id="ab" class="s">돌아가기</button>
</div>

<div class="ov hide" id="over">
  <div class="nb hide" id="onb">NEW BEST!</div>
  <div class="ttl" id="ot"></div>
  <div class="big" id="os">0</div>
  <p class="q" id="oq"></p>
  <p class="st" id="ob"></p>
  <div><button id="re">다시 도전</button><button id="sh" class="s">공유하기</button></div>
  <div><button id="mn" class="s">메뉴</button></div>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const LW=360,BH=36,BASE_W=170,TF=[0,5,10,20,30,50];
const SK=[
{n:'야식',u:0,h:260,f:'🍗 🍜 🍕 🍔 🍙 🧋 🍟 🌭 🥟 🍩',t:['개미 건축가 🐜','견습 막노동러 🔨','야식 설계사 🍜','부장님도 인정 🫡','건설사 임원 🏗️','바벨탑 CEO 👑']},
{n:'직장인',u:15,h:200,f:'💼 📎 ☕ 🖨️ 📊 🧾 💻 📱',t:['출근 5분 전 인턴 📎','신입사원 💼','칼퇴 장인 ☕','과장님 승진 📊','부장님 🫡','회장님 👑']},
{n:'동물',u:30,h:120,f:'🐶 🐱 🐹 🐰 🦊 🐻 🐼 🐸',t:['아기 병아리 🐣','동네 집사 🐱','동물원 사육사 🦁','노아의 방주 선원 🐘','동물의 왕 🦁','방주 선장 👑']},
{n:'우주',u:50,h:285,f:'🌍 🌙 ⭐ 🪐 🚀 🛸 👽 🌟',t:['지구인 🌍','달 탐사원 🌙','화성 이주민 🪐','은하 건축가 🚀','외계인 친구 👽','우주의 지배자 👑']}
].map(k=>(k.f=k.f.split(' '),k));
const QP=[['개미도 이거보단 높이 쌓겠다','손이 미끄러졌죠?'],['워밍업은 끝났죠?','아깝다, 한 번만 더!'],['타이밍 감 오고 있어요','이 정도면 취미 있는 손'],['손가락에 눈 달렸나요','이건 재능입니다'],['지금 바로 인스타에 올리세요','혹시 프로세요?'],['전설 등극. 공유 필수','타워가 아니라 신화입니다']];
const A=[['p1','첫 PERFECT ✨',()=>mc>=1],['p3','PERFECT 3연속',()=>mc>=3],['p7','PERFECT 7연속 🔥',()=>mc>=7],['f10','10층 돌파',()=>score>=10],['f25','25층 돌파',()=>score>=25],['f50','50층 돌파 🏆',()=>score>=50],['f100','100층 전설 👑',()=>score>=100],['g10','10판 플레이',()=>V.games>=10],['t200','누적 200층',()=>V.total+score>=200],['gd','황금 블록 획득 ✨',()=>gold>=1],['d1','오늘의 챌린지 도전 📅',()=>daily&&score>=1],['d15','챌린지 15층 돌파',()=>daily&&score>=15]];
const tier=n=>{let t=0;TF.forEach((a,i)=>{if(n>=a)t=i});return t};
const title=n=>SK[V.skin].t[tier(n)];

let V={best:0,games:0,total:0,ach:{},skin:0,mute:0,rank:[],dbest:{d:'',s:0}};
try{Object.assign(V,JSON.parse(localStorage.getItem('stk2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('stk2',JSON.stringify(V))}catch(e){}};

let lw=0,lh=0,s=1,LH=640,dpr=1,offX=0,ST=0,gc=null,gk='';const EM={};const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){const W=innerWidth||360,H=innerHeight||640;lw=innerWidth;lh=innerHeight;dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);s=Math.min(W/LW,H/560);LH=H/s;offX=(W/s-LW)/2;ST=(parseFloat(getComputedStyle($('sa')).paddingTop)||0)/s;gk='';for(const k in EM)delete EM[k]}
addEventListener('resize',resize);addEventListener('orientationchange',resize);resize();

let paused=false,lock=0,daily=false,gold=0,rng=Math.random,beat=0,chal=+(new URLSearchParams(location.search).get('c'))||0;
let st='menu',blocks,cur,dir,spd,cam,camT,score,combo,mc,debris,pops,parts,shake=0,flash=0,lastT=0,newBest=false;

let ac;
function beep(f,d,type){
  if(V.mute)return;
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}
}
let tt;
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hide');clearTimeout(tt);tt=setTimeout(()=>e.classList.add('hide'),2200)}
function chk(){A.forEach(([id,nm,fn])=>{if(!V.ach[id]&&fn()){V.ach[id]=1;toast('🏅 업적 달성: '+nm);save()}})}

function mulb(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const today=()=>{const d=new Date();return ''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')};
function reset(d){
  daily=!!d;rng=daily?mulb(+today()):Math.random;gold=0;beat=0;
  blocks=[{x:(LW-BASE_W)/2,w:BASE_W,f:0}];
  score=0;combo=0;mc=0;debris=[];pops=[];parts=[];cam=0;camT=0;shake=0;flash=0;newBest=false;
  spawn();
}
function spawn(){
  const p=blocks[blocks.length-1],n=blocks.length;
  spd=(2.2+Math.min(n,60)*0.07)*(daily?1.15:1);dir=n%2?-1:1;
  const g=n>=8&&(n%12===0||rng()<.05);
  cur={x:dir===1?-20:LW-p.w+20,w:p.w,f:n%SK[V.skin].f.length,g};
}
const pop=(t,h)=>pops.push({t,h,age:0});
function burst(x,h){
  const e=SK[V.skin].f[cur?cur.f:0];
  for(let i=0;i<8&&parts.length<80;i++)parts.push({x,h,vx:(Math.random()-.5)*6,vy:Math.random()*4+2,l:1,e});
}

function tap(){
  if(st!=='play'||!cur||paused||performance.now()<lock)return;
  const p=blocks[blocks.length-1],n=blocks.length,hT=(n+1)*BH;
  const l=Math.max(cur.x,p.x),r=Math.min(cur.x+cur.w,p.x+p.w),ov=r-l;
  if(ov<=0){debris.push({x:cur.x,w:cur.w,h:hT,vy:0,f:cur.f,i:n,g:cur.g});cur=null;end();return}
  let nb;
  if(Math.abs(cur.x-p.x)<5){
    combo++;mc=Math.max(mc,combo);nb={x:p.x,w:p.w,f:cur.f};
    if(combo>=3&&nb.w<BASE_W){nb.w=Math.min(BASE_W,nb.w+8);nb.x-=4}
    pop(combo>1?'PERFECT x'+combo:'PERFECT!',hT);burst(nb.x+nb.w/2,hT);
    beep(500+combo*60,.18,'triangle');
    if(navigator.vibrate)navigator.vibrate(15);
  }else{
    combo=0;nb={x:l,w:ov,f:cur.f};
    if(cur.x<p.x)debris.push({x:cur.x,w:p.x-cur.x,h:hT,vy:0,f:cur.f,i:n,g:cur.g});
    if(cur.x+cur.w>p.x+p.w)debris.push({x:p.x+p.w,w:cur.x+cur.w-(p.x+p.w),h:hT,vy:0,f:cur.f,i:n,g:cur.g});
    beep(300+(score%8)*30,.12);
  }
  const pv=score;blocks.push(nb);score++;
  if(cur.g){
    const c=nb.x+nb.w/2;nb.g=1;gold++;nb.w=BASE_W;nb.x=Math.min(LW-BASE_W,Math.max(0,c-BASE_W/2));score+=2;
    pop('✨ 황금 블록! +3층',hT+BH);flash=1;beep(1000,.35,'square');burst(c,hT);burst(c,hT);
  }
  if(Math.floor(score/10)>Math.floor(pv/10)){
    nb.w=Math.min(BASE_W,nb.w+12);nb.x=Math.max(-10,nb.x-6);
    pop('🎉 '+Math.floor(score/10)*10+'층! 보너스 폭 회복',hT+BH*2);flash=1;beep(880,.3,'square');
  }else if(tier(score)>tier(pv)){pop(title(score),hT+BH*2);flash=1}
  if(chal&&!beat&&score>chal){beat=1;pop('🏆 친구 추월!',hT+BH*3);toast('🏆 친구 기록 돌파!')}
  chk();spawn();
}
function end(){
  st='over';shake=RM?0:12;$('pb').classList.add('hide');beep(120,.35,'sawtooth');
  if(navigator.vibrate)navigator.vibrate(60);
  newBest=score>V.best&&score>0;if(newBest)V.best=score;
  if(score>0){V.rank.push({s:score,k:SK[V.skin].n,d:daily?'📅':'',t:new Date().toLocaleDateString('ko-KR')});V.rank.sort((a,b)=>b.s-a.s);V.rank=V.rank.slice(0,10)}
  if(daily&&(V.dbest.d!==today()||score>V.dbest.s))V.dbest={d:today(),s:score};
  V.games++;V.total+=score;chk();save();
  setTimeout(()=>{
    $('onb').classList.toggle('hide',!newBest);
    $('ot').textContent=(daily?'📅 ':'')+title(score);$('os').textContent=score+'층';
    $('oq').textContent=QP[tier(score)][Math.random()<.5?0:1];
    $('ob').textContent='최고 '+V.best+'층 · 누적 '+V.total+'층 · '+V.games+'판';
    $('over').classList.remove('hide');
  },700);
}
function start(d){reset(d);st='play';paused=false;lock=performance.now()+250;['menu','over','ach','pz'].forEach(i=>$(i).classList.add('hide'));$('pb').classList.remove('hide')}
function pause(){if(st!=='play'||paused)return;paused=true;$('pz').classList.remove('hide')}
function resume(){paused=false;lock=performance.now()+300;$('pz').classList.add('hide')}
function menu(){
  st='menu';paused=false;$('pz').classList.add('hide');$('pb').classList.add('hide');reset();$('over').classList.add('hide');$('menu').classList.remove('hide');
  $('mu').textContent=V.mute?'🔇':'🔊';
  $('ms').textContent='최고 '+V.best+'층 · 오늘 챌린지 '+(V.dbest.d===today()?V.dbest.s+'층':'-')+' · 업적 '+Object.keys(V.ach).length+'/'+A.length;
  const box=$('sk');box.innerHTML='';
  SK.forEach((k,i)=>{
    const lk=V.best<k.u,b=document.createElement('button');
    b.className=(i===V.skin?'on ':'')+(lk?'lk':'');
    b.innerHTML=(lk?'🔒':k.f[0])+'<small>'+(lk?k.u+'층':k.n)+'</small>';
    b.onclick=()=>{if(lk){toast('🔒 최고 '+k.u+'층 달성 시 해금!');return}V.skin=i;save();menu()};
    box.appendChild(b);
  });
}
function panel(t,html){$('ah').textContent=t;$('al').innerHTML=html;$('menu').classList.add('hide');$('ach').classList.remove('hide')}
function showAch(){panel('🏅 업적',A.map(([id,nm])=>'<div class="'+(V.ach[id]?'ok':'')+'">'+(V.ach[id]?'✅ ':'⬜ ')+nm+'</div>').join(''))}
function showRank(){panel('🏆 내 기기 랭킹',(V.rank.length?V.rank.map((r,i)=>'<div'+(i<3?' class="ok"':'')+'>'+(['🥇','🥈','🥉'][i]||(i+1)+'.')+' '+r.s+'층 · '+r.k+' '+r.d+' · '+r.t+'</div>').join(''):'<div>아직 기록이 없어요</div>')+'<div>🔗 친구와는 공유 링크로 대결해요</div>')}

cv.addEventListener('pointerdown',e=>{e.preventDefault();tap()});
$('go').onclick=()=>start(false);$('re').onclick=()=>start(daily);$('dl').onclick=()=>start(true);$('rk').onclick=showRank;$('pb').onclick=pause;$('rs').onclick=resume;$('rt').onclick=()=>start(daily);$('qm').onclick=menu;$('mn').onclick=menu;$('am').onclick=showAch;
$('ab').onclick=()=>{$('ach').classList.add('hide');$('menu').classList.remove('hide')};
$('mu').onclick=()=>{V.mute=V.mute?0:1;save();$('mu').textContent=V.mute?'🔇':'🔊'};
$('sh').onclick=async()=>{
  const u=location.href.split('?')[0]+'?c='+score;const t=(daily?'[오늘의 챌린지] ':'')+'스택 타워 '+SK[V.skin].n+' 편에서 '+score+'층 쌓음! '+title(score)+'\n나 이겨봐 👉 ';
  try{if(navigator.share)await navigator.share({text:t,url:u});
  else{await navigator.clipboard.writeText(t+u);$('sh').textContent='복사됨 ✅';setTimeout(()=>$('sh').textContent='공유하기',1500)}}catch(e){}
};
['gesturestart','contextmenu'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});addEventListener('pagehide',pause);
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowDown'){e.preventDefault();tap()}
  else if(e.code==='Escape'||e.code==='KeyP'){paused?resume():pause()}
});

function update(dt){
  if(cur&&st==='play'){
    cur.x+=dir*spd*dt;const mn=-20,mx=LW-cur.w+20;
    if(cur.x>mx){cur.x=mx;dir=-1}else if(cur.x<mn){cur.x=mn;dir=1}
  }
  camT=Math.max(0,(blocks.length+1)*BH+90-LH*.55);cam+=(camT-cam)*.08*dt;
  for(const d of debris){d.vy+=.5*dt;d.h-=d.vy*dt}
  debris=debris.filter(d=>LH-90-d.h+cam<LH+120);
  for(const p of parts){p.vy-=.3*dt;p.h+=p.vy*dt;p.x+=p.vx*dt;p.l-=dt/40}
  parts=parts.filter(p=>p.l>0);
  for(const p of pops)p.age+=dt/70;
  pops=pops.filter(p=>p.age<1);
  if(shake>0)shake=Math.max(0,shake-.6*dt);
  if(flash>0)flash=RM?0:Math.max(0,flash-.03*dt);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function sprite(e){const k=e+'|'+(s*dpr).toFixed(2);if(EM[k])return EM[k];const z=Math.max(4,Math.ceil(26*s*dpr)),c=document.createElement('canvas');c.width=c.height=z;const x=c.getContext('2d');x.font=(z*.8)+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e,z/2,z/2+z*.04);return EM[k]=c}
function blk(x,w,h,f,i,g){
  const y=LH-90-h+cam;if(y>LH+60||y<-BH)return;
  ctx.fillStyle=g?'#ffd84d':'hsl('+((i*17+10)%360)+' 75% 58%)';if(g){ctx.shadowColor='#fff3a0';ctx.shadowBlur=14}rr(x,y,w,BH-2,8);ctx.fill();ctx.shadowBlur=0;
  ctx.save();rr(x,y,w,BH-2,8);ctx.clip();
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(x,y,w,6);
  const sp=sprite(g?'✨':SK[V.skin].f[f]||SK[V.skin].f[0]);
  for(let ex=Math.floor(x/36)*36+18;ex<x+w+18;ex+=36)ctx.drawImage(sp,ex-13,y+BH/2-12,26,26);
  ctx.restore();
}
function draw(){
  ctx.setTransform(dpr*s,0,0,dpr*s,offX*dpr*s,0);
  const hue=(SK[V.skin].h+score*3)%360,k=hue+'|'+LH;
  if(k!==gk){gk=k;gc=ctx.createLinearGradient(0,0,0,LH);gc.addColorStop(0,'hsl('+hue+' 60% 16%)');gc.addColorStop(1,'hsl('+((hue+40)%360)+' 70% 32%)')}
  ctx.fillStyle=gc;ctx.fillRect(-offX,0,LW+offX*2,LH);
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const gy=LH-90+cam;if(gy<LH){ctx.fillStyle='#2a1a4d';ctx.fillRect(-offX-10,gy,LW+offX*2+20,LH-gy+20)}
  blocks.forEach((b,i)=>blk(b.x,b.w,(i+1)*BH,b.f,i,b.g));
  if(cur)blk(cur.x,cur.w,(blocks.length+1)*BH,cur.f,blocks.length,cur.g);
  debris.forEach(d=>blk(d.x,d.w,d.h,d.f,d.i,d.g));
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='18px serif';
  for(const p of parts){ctx.globalAlpha=p.l;ctx.fillText(p.e,p.x,LH-90-p.h+cam)}
  ctx.textBaseline='alphabetic';ctx.fillStyle='#ffd84d';ctx.font='900 22px sans-serif';
  for(const p of pops){ctx.globalAlpha=1-p.age;ctx.fillText(p.t,LW/2,LH-90-p.h+cam-p.age*40-10)}
  ctx.globalAlpha=1;ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+flash*.35+')';ctx.fillRect(-offX,0,LW+offX*2,LH)}
  if(st==='play'&&score===0&&!paused){ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='800 20px sans-serif';ctx.fillText('👆 화면을 탭해서 멈춰!',LW/2,LH*.3)}
  if(st!=='menu'){ctx.save();ctx.translate(0,ST);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='900 64px sans-serif';ctx.fillText(score,LW/2,86);
    ctx.font='700 15px sans-serif';ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillText(title(score),LW/2,112);
    if(combo>1){ctx.fillStyle='#ffd84d';ctx.fillText('🔥 '+combo+'연속',LW/2,134)}
    if(chal&&!beat){ctx.fillStyle='#ff9ab0';ctx.fillText('친구 '+chal+'층 도전 중',LW/2,combo>1?154:134)}
    ctx.textAlign='right';ctx.font='700 13px sans-serif';ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillText((daily?'📅 오늘의 챌린지 · ':'')+'BEST '+V.best,LW-14,30);ctx.restore();
  }
}
let fc=0;
function frame(t){requestAnimationFrame(frame);if(paused||document.hidden){lastT=t;return}if(innerWidth!==lw||innerHeight!==lh)resize();fc++;if(st==='menu'&&fc%4){return}const dt=Math.min(2,(t-lastT)/16.67||1);lastT=t;update(dt);draw()}
menu();requestAnimationFrame(frame);
if(chal)toast('🔥 친구가 '+chal+'층! 이겨봐');
})();
</script>
