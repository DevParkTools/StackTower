{x:9,n:'장로 노바',c:'#8a9aa8',th:'…수호자여, 나는 너를 원망하지 않는다…',l:['오래전 이곳은 빛나는 지하 왕국이었다네.','그러나 회색 역병이 번졌고, 수호자는 왕국을 지키려 스스로 문을 걸어 잠갔지.','작은 기사여, 심연 끝의 수호자를 쓰러뜨려 역병의 뿌리를 끊어주게.','길 어딘가에 그림자 망토와 바람 날개가 잠들어 있을 걸세.','수호자 너머엔 서리 첨탑이 있다네. 사마귀 발톱이 없으면 오를 수 없지.']},
{x:15,n:'지도 제작자 코르',c:'#c8a060',th:'…이 지도의 빈 곳이 두렵다…',l:['내 이름은 코르, 지도 제작자지.','걸은 길이 저절로 기록되는 지도를 주겠네.','Tab으로 펼쳐 보게. 벤치는 길을 잃은 자의 쉼터라네.']},
{x:21,n:'상인 셀',c:'#6aa890',th:'…오늘도 아무도 안 사가는군…',l:['지오(영혼 조각)가 있나? 거래하세.','[1] 마스크 조각 +1 (60 지오)   [2] 검 단련 (40 지오)','숫자 키로 구매하고, 끝나면 Z를 누르게.']}
];
var PU=[{x:48,t:0,g:0,m:'그림자 망토 획득! C로 대시'},{x:96,t:1,g:0,m:'바람 날개 획득! 공중에서 한 번 더 점프'},{x:152,t:2,g:0,m:'사마귀 발톱 획득! 벽에 붙어 Z로 벽 점프'},{x:26,t:3,g:0,m:'부적: 빠른 베기 (I로 장착)'},{x:57,t:4,g:0,m:'부적: 영혼 포획 (I로 장착)'},{x:100,t:5,g:0,m:'부적: 긴 검 (I로 장착)'},{x:121,t:6,g:0,m:'부적: 단단한 껍질 (I로 장착)'},{x:172,t:7,g:0,m:'부적: 지오 수집가 (I로 장착)'}];

var P={x:0,y:0,w:18,h:28,vx:0,vy:0,g:0,f:1,hp:5,inv:0,at:0,aid:0,ad:0,dt:0,dc:0,co:0,jb:0,kb:0,soul:0,wall:0,j2:1,ah:0,fo:0,fc:0,sit:0,lid:0,am:14};

function setT(x,y,w,h,v){for(var j=y;j<y+h;j++){for(var i=x;i<x+w;i++){if(i>=0&&i<MW&&j>=0&&j<MH){G[j*MW+i]=v}}}}
function sol(x,y){if(x<0||x>=MW||y<0){return 1}if(y>=MH){return 0}return G[y*MW+x]}
function hit(x,y,w,h){
var x0=Math.floor(x/T),x1=Math.floor((x+w-1)/T),y0=Math.floor(y/T),y1=Math.floor((y+h-1)/T);
for(var j=y0;j<=y1;j++){for(var i=x0;i<=x1;i++){if(sol(i,j)){return 1}}}

function zoneOf(x){var t=x/T;return t<28?0:t<85?1:t<136?2:t<150?3:t<180?4:5}
function banner(s){bn=s;bt=150}

function mv(o){
o.wall=0;o.x+=o.vx;
if(o.vx!==0&&hit(o.x,o.y,o.w,o.h)){var s=o.vx>0?1:-1;o.x-=o.vx;while(!hit(o.x+s,o.y,o.w,o.h)){o.x+=s}o.vx=0;o.wall=1}
o.g=0;o.y+=o.vy;
if(o.vy!==0&&hit(o.x,o.y,o.w,o.h)){var q=o.vy>0?1:-1;o.y-=o.vy;while(!hit(o.x,o.y+q,o.w,o.h)){o.y+=q}if(q>0){o.g=1}o.vy=0}}
function reveal(cx,cy){
if(cx<0||cx>=CW||cy<0||cy>=CH||EX[cy*CW+cx]){return}
EX[cy*CW+cx]=1;
MX.fillStyle='#0c1620';MX.fillRect(cx*12,cy*12,12,12);
MX.fillStyle='#3a6a8a';
for(var j=cy*4;j<cy*4+4&&j<MH;j++){for(var i=cx*4;i<cx*4+4&&i<MW;i++){if(G[j*MW+i]){MX.fillRect(i*3,j*3,3,3)}}}}
function sp(t,tx,ty){

var h=t===0?18:t===1?20:30,w=t===0?26:t===1?22:28;
E.push({t:t,x:tx*T,y:t===1?ty*T:ty*T-h,w:w,h:h,vx:0,vy:0,hp:(t===0?3:t===1?2:6)+(tx>150?2:0),d:-1,fl:0,lid:-1,lf:-1,g:0,wall:0,by:ty*T})}
function setBoss(){
B.w=bk?64:56;B.h=bk?56:64;B.mx=bk?70:40;B.hp=B.mx;
B.x=(bk?192:145)*T;B.y=bk?9*T:15*T-B.h;
B.vx=0;B.vy=0;B.st=0;B.t=60;B.f=-1;B.act=0;B.fl=0;B.lid=-1;B.lf=-1;B.rt=0}
function init(){
G.fill(0);
setT(0,15,MW,2,1);setT(0,0,MW,1,1);setT(0,0,1,MH,1);setT(MW-1,0,1,MH,1);
setT(70,15,7,2,0);setT(52,15,4,2,0);setT(108,6,2,9,1);setT(160,5,1,8,1);setT(163,5,1,10,1);
for(var i=0;i<PL.length;i++){setT(PL[i][0],PL[i][1],PL[i][2],1,1)}
E.length=0;PT.length=0;FB.length=0;
var c0=[32,45,55,62,66,82,90,98,112,118,124,156,166,168,172,178],f1=[[36,8],[50,8],[66,6],[96,7],[116,8],[122,6],[130,8],[158,6],[168,4],[176,8],[179,6]],s2=[48,84,100,116,128,157,170,178];
for(var a=0;a<c0.length;a++){sp(0,c0[a],15)}
for(var b=0;b<f1.length;b++){sp(1,f1[b][0],f1[b][1])}
for(var c=0;c<s2.length;c++){sp(2,s2[c],15)}
setBoss();if(bk===0){setT(150,1,1,14,1)}
P.x=BN[bi]*T+16-P.w/2;P.y=15*T-P.h;P.vx=0;P.vy=0;P.hp=mh;P.inv=60;P.at=0;P.dt=0;P.dc=0;P.kb=0;P.jb=0;P.f=1;P.soul=0;P.sit=0;P.fo=0;P.fc=0;
lgx=P.x;lgy=P.y;cam=Math.max(0,Math.min(MW*T-W,P.x-W/2));zn=-1}
function hurt(o){
if(P.inv>0||P.dt>0||st!==1){return}
P.hp--;P.inv=70+(eq[3]?40:0);P.kb=12;P.vy=-6;P.fo=0;P.fc=0;
P.vx=(P.x+P.w/2<o.x+o.w/2?-1:1)*5;
shake=8;hs=6;snd('hurt');burst(P.x+P.w/2,P.y+P.h/2,14,'#fff');
if(P.hp<=0){st=2;sT=0}}
function hitE(o){
if(P.at>6&&o.lid!==P.aid&&ov(HB.x,HB.y,HB.w,HB.h,o.x,o.y,o.w,o.h)){
o.lid=P.aid;o.hp-=nd;o.fl=6;hs=3;
P.soul=Math.min(99,P.soul+(eq[1]?17:11));snd('hit');
if(P.ad===2){P.vy=-9;P.dc=0;P.j2=1}
if(o!==B){o.vx=P.f*4}
burst(o.x+o.w/2,o.y+o.h/2,8,'#9ff');shake=3;return 1}
return 0}
function updP(){
if(P.sit){P.vx=0;P.vy=0;P.hp=mh;return}
var d=(K.ArrowRight?1:0)-(K.ArrowLeft?1:0);
if(K.KeyA){P.ah++}
if(K.KeyA&&P.ah>=15&&P.g&&P.soul>=33&&P.hp<mh&&P.kb<=0){
P.fo=1;P.fc++;P.vx*=0.5;

}else{P.fo=0;P.fc=0}

if(P.jb>0){
P.jb--;
if(wl&&!P.g){P.vy=-11;P.vx=-wl*6;P.kb=7;P.f=-wl;P.jb=0;P.j2=1;snd('jmp')}

else if(hasDbl&&P.j2){P.vy=-10.5;P.j2=0;P.jb=0;snd('jmp');burst(P.x+P.w/2,P.y+P.h,10,'#cfe')}}
if(!K.KeyZ&&P.vy<-4){P.vy=-4}
mv(P);
if(P.at>0){
P.at--;
if(P.ad===1){HB.x=P.x-12;HB.y=P.y-44;HB.w=42;HB.h=44}
else if(P.ad===2){HB.x=P.x-12;HB.y=P.y+P.h;HB.w=42;HB.h=40}
else{var lw=46+(eq[2]?16:0);HB.x=P.f>0?P.x+P.w:P.x-lw;HB.y=P.y-2;HB.w=lw;HB.h=32}}
if(P.dc>0){P.dc--}
if(P.inv>0){P.inv--}
if(P.g&&P.dt<=0&&(tm&7)===0){
var bx0=Math.floor(P.x/T),bx1=Math.floor((P.x+P.w)/T),by=Math.floor((P.y+P.h+1)/T);
if(sol(bx0,by)&&sol(bx1,by)){lgx=P.x;lgy=P.y}}
if(P.y>MH*T){
P.hp--;P.x=lgx;P.y=lgy;P.vx=0;P.vy=0;P.inv=60;
if(P.hp<=0){st=2;sT=0}}
var cx=Math.floor(P.x/T/4);
for(var i=-1;i<=1;i++){for(var j=0;j<CH;j++){reveal(cx+i,j)}}
var z=zoneOf(P.x);
if(z!==zn){zn=z;banner(ZN[z])}
for(var k=0;k<PU.length;k++){
var u=PU[k];
if(!u.g&&ov(P.x,P.y,P.w,P.h,u.x*T,13*T,T,T*2)){u.g=1;if(u.t===0){hasDash=1}else if(u.t===1){hasDbl=1}else if(u.t===2){hasWall=1}else{ow[u.t-3]=1}banner(u.m);snd('pick');burst(u.x*T+16,14*T,40,'#fff');shake=6}}
if(P.x>(bk?184:138)*T&&!B.act){B.act=1;setT(bk?180:136,1,1,14,1);shake=10;snd('roar');banner(bk?'서리의 군주':'타락한 수호자')}}
function updE(){
for(var i=E.length-1;i>=0;i--){
var o=E[i];
if(o.fl>0){o.fl--}
if(o.t===3){
o.vy+=0.4;o.y+=o.vy;
if(o.y>15*T-o.h){burst(o.x+o.w/2,15*T,8,'#a8b');E[i]=E[E.length-1];E.pop();continue}
if(ov(P.x,P.y,P.w,P.h,o.x,o.y,o.w,o.h)){hurt(o)}
continue}
if(o.t!==1){
var dx=P.x-o.x,near=Math.abs(dx)<220&&Math.abs(P.y-o.y)<60;

mv(o);

}else{

else{o.x+=Math.sin(tm*0.03+o.by)*0.8;o.y+=Math.sin(tm*0.05+o.by)*0.6}}
hitE(o);
for(var f=0;f<FB.length;f++){

if(o.lf!==b.id&&ov(b.x,b.y,28,20,o.x,o.y,o.w,o.h)){o.lf=b.id;o.hp-=3;o.fl=6;burst(o.x+o.w/2,o.y+o.h/2,10,'#9ff')}}

var gv=o.t===0?2:o.t===1?3:5;if(eq[4]){gv=Math.ceil(gv*1.5)}geo+=gv;
E[i]=E[E.length-1];E.pop();continue}
if(ov(P.x,P.y,P.w,P.h,o.x,o.y,o.w,o.h)){hurt(o)}}
for(var g=FB.length-1;g>=0;g--){

if(q.l<=0||sol(Math.floor((q.x+14)/T),Math.floor((q.y+10)/T))){burst(q.x+14,q.y+10,8,'#9ff');FB[g]=FB[FB.length-1];FB.pop()}}}
function updB(){

if(bk===0){
if(B.st===0){

else if(B.st===2){
B.t++;
if(B.g&&B.t>5){B.st=3;B.t=ph>1?28:40;B.vx=0;shake=12;burst(B.x+B.w/2,B.y+B.h,20,'#a8b')}}
else{B.vx=0;B.t--;if(B.t<=0){B.st=0;B.t=ph>1?25:40}}
B.vy=Math.min(B.vy+0.6,14);
mv(B)
}else{
